coder: blind-sonnet
created: '2026-11-12'
vocabulary:
  light_low_occupied: Living-room light level low, someone present.
  media_playing_occupied: Media playing in a room with people present, no other-room facts.
  indoor_hot_occupied: Indoor temperature high (29.4C), people present, windows closed or unstated.
  indoor_hot_window_open_empty: Indoor temperature high, everyone out, living-room windows all open.
  low_humidity_bedroom: Bedroom humidity low (28%), humidifier water tank full or unstated.
  humidifier_tank_empty: Humidifier water tank empty for a long stated time, with overheating history.
  all_asleep_idle: Everyone asleep at night, nothing abnormal reported.
  away_idle_appliance: Everyone out, appliance waiting/loaded, drain normal.
  kitchen_empty_gas_normal: Kitchen unattended, gas detector normal.
  exterior_motion_asleep: Motion outside the front door while all asleep.
  away_vehicle_absent: Everyone out, vehicle has not returned.
  leak_flooding_away: Leak detector flood alarm, water pooling on floor, everyone out.
  floor_clear_away: Everyone out, living-room floor tidy, no obstacles.
  pet_waste_on_floor: Everyone out, pet waste detected on living-room carpet.
  heater_area_clear: Room cold (16.2C), 1m around heater empty.
  heater_covered_by_cloth: Room cold (16.2C), wet towel draped over heater.
  cooking_prep_occupied: Kitchen occupied, cooking preparation in progress.
  oven_unattended_packaging: Kitchen unattended 30 min, packaging material inside oven.
  window_sill_clear: Living room occupied, window sill empty.
  cat_on_sill: Cat sitting on living-room window sill, motion continuing.
  hallway_motion_adult_home: Hallway motion at night, an adult just came home (or motion only, no other facts).
  infant_asleep_adjacent_door_open: Infant asleep in adjacent room with door open, shortly after falling asleep.
  iron_on_stand_occupied: Iron upright on its rest, utility room occupied.
  iron_flat_on_clothes_away: Iron soleplate lying on a pile of clothes, everyone out.
  gas_alarm_transient: Single gas alarm right after stove ignition, ventilation on, reading falling.
  gas_alarm_persistent: Gas alarm persisting, reading rising (candle lit in living room, or unspecified).
  smoke_alarm_transient_cooking: Single smoke alarm while someone cooks in kitchen, fan on, reading falling.
  smoke_alarm_rising_asleep: Hallway smoke alarm, smoke density rising, everyone asleep (burning smell or unspecified).
  oven_running_attended: Oven at 220C for 40 min, someone cooking in kitchen, timer 5 min left.
  oven_running_unattended_smoke: Oven at 220C for 2 hours, kitchen unattended, smoke from oven, detector rising.
  high_temp_sunlit_sensor: Temperature sensor 57C in direct sunlight, occupant comfort normal.
  high_temp_rising_near_heater: Temperature 72C rising fast, curtain touching electric heater, room unattended.
  leak_alarm_minor_drips: Leak alarm, a few drops from washer hose, floor nearly dry.
  leak_spreading_to_outlets: Leak alarm, water spreading toward power strip and outlets, unattended.
  water_main_scheduled_irrigation: Water main flow anomaly coinciding with scheduled garden watering, ends in 30 min.
  water_main_flooding_panel: Water main flow surge, basement boiler room flooding up to electrical panel height.
  door_open_resident_return: Front door opened, a resident just returned with normal unlock record.
  door_open_stranger_asleep: Front door opened, all asleep, no unlock record, unfamiliar movement toward living room.
  lock_battery_low: Door lock battery low (15%), door properly locked (or no other facts).
  lock_tamper_knocking: Door lock tamper alarm, person outside pounding and shaking handle, resident in living room.
  no_observation: Sentence contains no physical observation.
