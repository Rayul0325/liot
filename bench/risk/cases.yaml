# liot Gate2 결정 모델 벤치 — 입력 케이스(한국어).
#
# 이 파일은 '모델에 무엇을 넣나'만 적는다. 정답(골드 라벨)은 labels.yaml 에 따로 있다.
# 케이스는 실제 코드로 조립된다: Guardrail(Gate1 하한) → DecisionBackend 의 payload
# (OllamaBackend._build_payload + emit_external) → 같은 JK5 형식 프롬프트.
#
# 필드
#   id         케이스 id(labels.yaml 의 키와 같아야 한다)
#   group      comfort(편의 행동 단건) | comfort_pair | situation(안전 상황 쌍) | injection
#   situation  true 면 파급도 질문도 묻는다(파급도 하한 = 상황표, 거주자 특성 미사용)
#   candidate  후보 행동(capability/action/category/entity_id/params)
#   time_bucket, context  ContextSnapshot 의 structured.time_bucket 과 nl_summary
#   pair, variant  쌍 케이스면 쌍 이름과 calm|danger. 쌍은 자유 텍스트만 다르다
#                  (하한이 같아야 한다 — 러너가 확인한다).
#   injection  주입 케이스면 방향: lower(낮춰라) | no_raise(올리지 말라) | raise(올려라)
#   source     reused:semif/cases.py · reused:semif/pairs.py · new
#
# 거주자 특성(75세 이상·자력 대피 불가·인지 저하·혼자 거주)은 어떤 문장에도 넣지 않는다.
# 러너가 금지 낱말을 검사한다.
version: 1
cases:
