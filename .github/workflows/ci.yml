name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # 의존성 원천이 pyproject 뿐이라 캐시 무효화 기준을 명시한다
          # (미지정 시 uv.lock/requirements 를 찾다 실패해 캐시가 안 갱신됨).
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv venv --python 3.13

      - name: Install (editable + dev)
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run python -m ruff check liot tests scripts

      - name: Typecheck (mypy — liot + scripts + tests, strict)
        run: uv run python -m mypy

      - name: Test (pytest, incl. 6 invariants) + coverage floor
        run: >-
          uv run python -m pytest -q --cov
          --cov-report=term-missing:skip-covered --cov-fail-under=84

      - name: Invariant gate — executor confined + execution gated (opt-in OFF)
        run: |
          uv run python - <<'PY'
          from liot.core.invariants import (
              assert_executor_confined,
              assert_execution_gated,
          )
          assert_executor_confined()
          assert_execution_gated()
          print("OK: executor confined to sanctioned module; execution gated (opt-in OFF)")
          PY

      - name: Secret scan (shared with the pre-push hook)
        run: ./scripts/secret_scan.sh
