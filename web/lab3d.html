<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LIOT 3D 랩 — 집을 직접 만지고, AI가 반응하는 걸 보세요</title>
    <meta
      name="description"
      content="로우폴리 3D 집에서 기기를 직접 클릭해 상태를 바꾸면, 실제 LIOT 파이프라인이 로컬 LLM까지 태워 판단하고 제안을 3D에 반영합니다."
    />
    <meta name="theme-color" id="themeColorMeta" content="#0b0908" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("liot-theme");
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23ff5c38'/%3E%3C/svg%3E"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.js",
          "three/addons/": "./assets/vendor/addons/"
        }
      }
    </script>
  </head>
  <body class="d3-body">
    <header class="nav is-scrolled" id="nav">
      <div class="nav-inner">
        <a class="brand" href="index.html" aria-label="LIOT 홈으로">
          <span class="dot" aria-hidden="true"></span>LIOT
        </a>
        <div class="nav-right">
          <nav class="nav-links" aria-label="주요 메뉴">
            <a href="lab.html">평면 랩</a>
            <a href="demo.html">시나리오</a>
          </nav>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="테마 전환">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
          </button>
          <a class="nav-cta" href="index.html">홈으로</a>
        </div>
      </div>
    </header>

    <main class="d3-main">
      <div id="scene" class="d3-scene" aria-label="3D 집"></div>
      <div id="labels" class="d3-labels" aria-hidden="true"></div>

      <!-- 좌상단 안내 -->
      <div class="d3-hint">
        <p class="eyebrow">Live 3D Lab · 실제 파이프라인</p>
        <h1 class="d3-title">집을 직접 만지고,<br /><span class="accent">AI가 반응하는 걸 보세요</span></h1>
        <p class="d3-sub">방 안의 <b>빛나는 기기를 클릭</b>해 상태를 바꾼 뒤, 아래에서 파이프라인을 돌리세요. 제안을 수락하면 집이 실제로 바뀝니다.</p>
        <p class="d3-tip" id="hoverTip">기기 위에 마우스를 올려보세요</p>
      </div>

      <!-- 우측 트레이스 드로어 -->
      <aside class="d3-trace" id="traceDrawer">
        <button class="d3-trace-toggle" id="traceToggle" aria-expanded="true">
          <span>Pipeline Trace</span>
          <span class="live" id="liveTag" hidden><i aria-hidden="true"></i>RUNNING</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="d3-trace-body" id="traceBody">
          <div class="trace-idle">
            <p>기기를 세팅하고 <b>실행</b>을 누르면<br />여기에 실제 판단 과정이 내려옵니다.</p>
          </div>
        </div>
      </aside>

      <!-- 하단 컨트롤 바 -->
      <div class="d3-dock">
        <div class="dock-run">
          <button class="btn btn-primary d3-run" id="runTick">
            AI 능동 점검
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
          <div class="dock-event">
            <select id="eventSel" aria-label="센서 이벤트 선택">
              <option value="binary_sensor.kitchen_gas">가스 감지</option>
              <option value="binary_sensor.hall_smoke">연기 감지</option>
              <option value="binary_sensor.bath_leak">누수 감지</option>
            </select>
            <button class="btn btn-ghost d3-run" id="runEvent">이벤트 발생</button>
          </div>
        </div>
        <div class="dock-cfg">
          <div class="seg" id="cond" role="group" aria-label="개입 조건">
            <button data-v="A">A 단일</button>
            <button data-v="B" class="on">B 차등</button>
          </div>
          <label class="d3-chk"><input type="checkbox" id="llm_on" checked /><span>로컬 LLM</span></label>
          <div class="seg" id="time" role="group" aria-label="시간대">
            <button data-v="day">낮</button>
            <button data-v="evening" class="on">저녁</button>
            <button data-v="night">심야</button>
          </div>
          <label class="d3-temp">온도 <b id="tempV">22°</b>
            <input type="range" id="temp" min="8" max="32" step="0.5" value="22" />
          </label>
          <button class="d3-reset" id="reset" title="초기화">초기화</button>
        </div>
      </div>

      <!-- 떠 있는 휴대폰 알림 -->
      <div class="d3-phone" id="phone" hidden>
        <div class="d3-phone-inner" id="phoneInner"></div>
      </div>

      <div class="d3-loading" id="loading">3D 집을 짓는 중…</div>
    </main>

    <script src="assets/main.js"></script>
    <script type="module" src="assets/lab3d.js"></script>
  </body>
</html>
