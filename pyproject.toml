[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liot"
version = "0.1.0"
description = "LIOT — 능동형 스마트홈 AI. 4-Layer 위험도 파이프라인(Phase1, 제안-만)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "LIOT" }]
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "aiosqlite",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "websockets>=12",
]
# 연구 실험(experiments/) 전용 — dev 에는 넣지 않는다. make check 는 이것 없이 돈다.
experiments = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]
# Home Assistant WebSocket 연동(실연동 시에만 필요). 단위 테스트는 미설치여도 동작.
ha = [
    "websockets>=12",
]

[project.scripts]
liot-demo = "liot.demo:main"
liot-serve = "liot.serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["liot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

# ── 품질 도구 ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 결함을 잡는 규칙만 켠다.
#   E4/E7/E9 임포트·문법 오류 · F 정의/미사용 · B 버그 유발 패턴 ·
#   SIM 불필요한 복잡도 · C4 컴프리헨션 · I 임포트 정렬 · UP 구식 문법
#
# 줄 길이(E5)는 뺐다. 근거 두 가지 — 2026-08-29 실측:
#   1) ruff 의 E501 은 문자 수가 아니라 **표시 폭**을 센다(한글=2열). 이 저장소는
#      한글 주석이 주 문서화 수단인데, 100열 제한이면 한글만 있는 줄은 50자까지만
#      쓸 수 있다. 당시 32건 중 4건이 실제로 그 아티팩트였다(예: guardrail.py 의 76자
#      주석이 105열로 잡힌다). 설명을 짧게 만드는 방향의 압력은 이득이 아니다.
#   2) 줄 길이는 결함 클래스가 아니다. 이 게이트의 목적은 버그를 막는 것이다.
#
# (앞선 판의 주석은 "555줄이 100자 초과"라고 적었는데, 그 555 는 `awk length` 가
#  센 **바이트** 수였다 — 한글이 3바이트라 부풀려진 값이다. 2026-08-29 실제 위반은
#  32건. 이 게이트 밖 수치라 코드가 바뀌면 늘고 준다 — 현재 값은
#  `ruff check --select E501 liot tests scripts --statistics` 로 본다.)
select = ["E4", "E7", "E9", "F", "B", "SIM", "C4", "I", "UP"]
ignore = [
    # str+Enum → StrEnum. 기능 이득이 없는데 멤버 문자열화·pydantic 직렬화가
    # 조용히 바뀔 수 있다(Layer·Destination·ExecDecision 은 계약 경계에 있다).
    # 안전 파이프라인에서 위험 대비 실익이 없어 제외한다.
    "UP042",
    # if/else → 삼항. 순수 취향이라 '결함 게이트' 성격에 맞지 않는다.
    "SIM108",
]


[tool.mypy]
python_version = "3.11"
# 전체(liot·scripts·tests)를 strict 로 본다. 2026-08-29 코드리뷰가 "가장 많이
# 바뀐 demo_server·serve·service 가 정작 검사 밖"이라고 지적해 범위를 넓혔다.
# 실측: 전체 strict 로 켜도 오류는 12건뿐이었고(잘 타입이 붙은 코드베이스)
# 전부 고쳤다 — 그중 escalate_only·sign_feedback 은 자기 docstring·MODULE_SPEC
# 이 str/int 도 받는다고 적어 놓고 선언만 좁던 실제 불일치였다.
files = ["liot", "scripts", "tests"]
strict = true
warn_unused_configs = true
# 아래 numpy 의 follow_imports="skip" 이 스텁(.pyi)에도 먹게 한다(기본은 스텁을 무조건 따라간다).
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "yaml.*", "websockets.*", "scipy.*"]
ignore_missing_imports = true

# numpy 2.5 의 스텁은 파이썬 3.12 문법(type 문)이라 python_version 3.11 의 mypy 가 구문 오류로
# 멈춘다. pytest 가 TYPE_CHECKING 에서 numpy 를 부르기 때문에 experiments 용으로 numpy 를 깔면
# make check 의 mypy 가 깨졌다(2026-11-12 실측). 우리 코드는 numpy 를 쓰지 않으므로 따라가지 않는다.
[[tool.mypy.overrides]]
module = ["numpy"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# 테스트에는 '모든 함수에 주석' 요구만 뺀다. 픽스처·테스트 함수 수백 개에
# 주석을 다는 건 잡음이고(그 요구만으로 365건), 정작 값어치 있는 검사 —
# 잘못된 인자 타입·존재하지 않는 속성·Any 누출 — 은 그대로 켜져 있다.
# 실제로 그렇게 켜서 30건을 찾았고, 그중엔 없는 속성에 값을 넣던 죽은 줄도
# 있었다(ThreadingHTTPServer.poll_interval).
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["liot"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# 커버리지 하한의 단일 원천. pytest-cov 가 이 값을 읽으므로 Makefile·pre-push·CI
# 는 `--cov-fail-under` 를 따로 적지 않는다(전에는 세 곳에 복제돼 올릴 때마다
# 셋 다 고쳐야 했다 — 148ffb1). 84% 는 2026-08-30 실측 85.7% 기준의 회귀 방지선.
fail_under = 84
# branch = true 는 켜지 않는다. 2026-09-16 실측: 줄 커버리지 87.51% 인 트리가
# 분기 커버리지로는 84.66% 라 하한 84% 와의 여유가 0.66%p 뿐이다(줄 기준은 3.5%p).
# 그 여유로는 작은 리팩터 하나에 게이트가 빨개져 '하한 = 회귀 방지선' 이 아니라
# '하한 = 잡음' 이 된다. 켜려면 하한을 분기 기준으로 다시 잡는 편이 맞다.
# 재측정: pytest --cov --cov-branch --cov-report=term
# 앵커를 반드시 붙인다. 앵커 없는 "\\.\\.\\." 는 '점 세 개가 들어간 아무 줄'에
# 매치해(주석·문자열·슬라이스 포함) 측정 대상에서 통째로 빠진다 — 2026-08-29
# 코드리뷰에서 ScopedRepo 의 테넌시 SQL 화이트리스트가 그렇게 사라져 있었다.
# 아래 패턴은 Protocol/스텁의 '...' 만 있는 줄만 제외한다.
exclude_lines = [
    "pragma: no cover",
    "^\\s*if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]
