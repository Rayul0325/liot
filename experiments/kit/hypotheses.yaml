# Final verdict of every hypothesis / research cycle, in the latest post-review wording.
#
# verdict categories (the figure and the kit use exactly these words):
#   지지 · 반증 · 판정 불가 · 구조상 결과 · 기술 결과 · 읽기에 따라 갈림 · 대기
# `raw` is the wording of the experiment's RESULTS.md verdict table (or of the HYPOTHESES.md
# post-hoc log where that is the later word). `exp` is the experiment folder; when its
# summary.json is missing the row is shown as 대기 no matter what is written here, and when the
# file appears while the row still says 대기, build.py prints a visible NEW-RESULT warning.

questions:
  Q1: {title: 안전 — 첫 경보와 보호자 호출, short: "Q1 안전 (E1·E2)"}
