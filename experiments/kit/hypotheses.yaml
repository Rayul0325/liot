  Q3: {title: 위험 판정 방식, short: "Q3 위험 판정 방식 (E4)"}
  Q4: {title: 적응 — 학습과 선호 변화, short: "Q4 적응 (E6)"}
  Q5: {title: 결정 모델, short: "Q5 결정 모델 (E5·E9)"}
  Q6: {title: 사다리·호출·테스트, short: "Q6 사다리·호출 (E7·E8)"}

