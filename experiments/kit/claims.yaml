    text: 상황 심각도가 특성 없는 관찰 필드로 드러날 때 '모델 상향을 보호자 호출에 쓰는 이득은 작다'는 결론은 AUC 만으로 나오지 않는다. 등록 문구에 '몇 칸에서'가 없어 두 읽기를 모두 보고한다 — 한 칸이라도 c* 가 2 를 넘으면 반증(읽기 i)이고 과반 칸에서 넘어야 반증(읽기 ii)이면 반증이 아니다. 현재 운영(AUC 0.5)에서는 최종값 방식이 오호출을 1~2%p 늘리고 놓침은 0.75%p 이하만 줄인다.
