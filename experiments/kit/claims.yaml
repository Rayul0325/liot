  - id: E16-04
    group: IV.Q2
    exp: e16_scoring_harm
    hyp: "C4.13 (b) (사이클 4)"
    verdict: "반증 (등록 비교군 R1) — R2 는 사후 기준"
    text: >-
      숨결 이하 50% 설정에서 피로·지연 부담 효과를 모두 끄면 liot_real 의 남은 피해 이점이 사라지는가. 등록 비교군(대 모두 명시 확인, R1)에서 이점은 11.4%p 에서 2.75%p 로 줄지만 구간 하한 2.33%p 가 2%p 를 넘어 반증이다. 남는 몫은 침묵(해로운 제안의 절반이 liot_real 이 제안하지 않는 견본에 있음)이며 부담과 무관하다. 사후 기준 R2(비교군에 같은 상한을 건 읽기)는 결과를 본 뒤 더했고 등록 판정이 아니다 — m=10% 에서는 사라질 이점이 처음부터 없었다(−1.15%p). 반증은 구조상 예상 가능했다(E3 의 H2.2 가 이미 침묵 효과 약 −14%p 를 보였다). 세트의 30.75% 에서는 R1 이점이 음수이고 판정은 세트 평균에 기댄 등록 규칙을 따랐다.
