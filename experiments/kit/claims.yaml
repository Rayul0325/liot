      - {label: 같은 비율 — 취약성 못 보는 모드(게이트 3 을 지키는 모드), fn: h15b_auc08_over2_share, args: {mode: blind}, path: [h15b, cells], expected: 42.7, round: 1, scale: 100, fmt: "{:.1f}", unit: "%", md: "42.7", note: "파생값 — summary.json 의 blind 요약 칸이 비어 있어 칸들에서 다시 계산(RESULTS.md 와 일치)"}
      - {label: AUC 0.8 이상 비구조 칸 수(모드마다), path: [h15b, by_mode, honest, "auc_ge_0.8_nonstructural", cells], expected: 96, round: 0, fmt: "{:,.0f}", unit: " 칸"}
