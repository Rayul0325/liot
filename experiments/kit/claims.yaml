# Machine-readable claim list behind experiments/REPORT_KIT.md.
#
# One claim = one report sentence. One item = one number inside it.
#   path      key path into <exp>/results/summary.json. Elements: a dict key, a list index, a
#             selector {field: value} that picks a list row, or "*" (fan out over a dict's values,
#             needs `agg`).
#   expected  the value the report quotes, in DISPLAY units (after `scale`), rounded to `round`
#             decimals. `TBD` is a placeholder that `check_numbers --propose` fills.
#   md        the text as printed in the experiment's RESULTS.md. The checker reports a
#             RESULTS-DIFF when RESULTS.md and summary.json disagree (it never edits either file).
# Pending claims (kind: pending) wait for an experiment whose summary.json has not landed yet.

limits:
  L-SIM: >-
    거주자가 알림을 읽고 판단하는 모델(피로·무심코 승인·정확도·응답 지연)은 전부 가정이고 사람 데이터로 맞춘 값이 아니다. 결론은 '가정한 범위 안에서'만 읽는다.
  L-GEN: >-
    시뮬레이터가 만든 해로운 제안의 약 96%가 LIOT 자신의 단계(땅거미·불씨)에 놓이는 것은 생성기를 우리가 쓴 결과이지 세상에서 잰 값이 아니다. 이 정렬에 기대는 수치는 구조상 결과다.
  L-GEN-LIGHT: >-
    생성기의 해로움 규칙과 견본, 그리고 해로운 제안이 어느 단계에 놓이는지를 정하는 노브는 우리가 정했다. 잔잔 쪽 해로움은 한 견본(조명 끄기)에 몰려 있어 다른 잔잔 견본은 시험하지 않았다.
  L-SEEDNOISE: >-
    구간은 같은 매개변수 점 안에서 씨앗만 다시 뽑은 '씨앗 잡음'이다. 가정(매개변수)의 불확실성은 어느 구간에도 들어 있지 않고, 세트 사이의 변동은 사분위로만 보였다.
  L-LAT: >-
    모델 지연(0.2·1.5·4초)·올림 확률 30%·마감 2초는 가정이고, 송신기는 가짜이며, 시간은 부하가 높은 한 대의 기계에서 번갈아 잰 상대 비교다. 폰까지 닿는 실제 시간은 재지 않았다.
  L-LAT-ALT: >-
    비교 대안은 운영 서비스를 상속한 얇은 래퍼이고, 지연의 차이는 '대안이 모델을 기다리도록 정의됐다'는 데서 나온다. 모델 응답의 내용은 재생하지 않았고 올림 여부는 가정이다.
  L-REPLAY: >-
    벤치 재생은 상황 사례 32건뿐이고 맥락 문장이 운영과 다르다. 모델은 정답이 아니므로 '불일치'는 '오류'가 아니다.
  L-FUZZ: >-
    '위반 0'은 무작위 퍼징이 만든 경로 안에서의 0이다. 경로를 강제로 채운 퍼징에서는 게이트 1(안전 알림이 늦거나 침묵하지 않는다)과 부딪히는 알려진 문제 두 종류가 잡혔다. 재시작·동시성의 모든 조합은 덮지 않았다.
  L-STRUCT-RULE: >-
    정답이 우리 표나 규칙에서 나오는 결과는 '우리 규칙을 우리 코드가 지킨다'는 뜻일 뿐 다른 구조와의 우열을 말하지 않는다. 비교 결론에 쓰지 않는다.
  L-CSTAR: >-
    모델 정직도·공격 비율·센서 오경보율·미등록 취약 가구 비율은 모두 가정이고 범위를 쓸어 보았을 뿐이다. 최종값 방식과 추론 변형은 서비스에 구현하지 않고 결정 수준에서 시뮬레이션했다.
  L-C28: >-
    탐지기 문턱(오탐 상향률 5%)과 '관찰 필드로 드러나는 위험' 비율은 가정이고, AUC 는 정규분포 가정의 요약이다. 반증 조건에 '몇 칸에서'가 없어 두 읽기를 모두 적었으므로, 결론은 읽기에 달렸다.
  L-FAKECLOCK: >-
    가짜 시계에서의 계수이고 시간 값은 이상적인 데몬(저장된 다음 발화 시각으로 점프)을 가정한다. 실제 데몬은 사다리 틱 때문에 0~5초 더 늦다.
  L-LADDER: >-
    가짜 시계와 가짜 송신기이고 시나리오 16개는 명세의 대표 경로일 뿐 모든 조합이 아니다. 송신 지연이 사다리 틱을 밀어내는 효과는 E1 에서 따로 잰다.
  L-BYSTANDER: >-
    보호자 응답은 지수분포 가정의 시뮬레이션이고 실제 가족의 응답 분포는 측정하지 않았다. 방관 효과 지수와 무응답 확률도 가정이며, 순차 호출은 구현하지 않고 시뮬레이션만 했다.
  L-E4-NOGT: >-
    위험 등급에는 독립된 정답이 없다. 우리 조회표를 기준점으로 쓴 값('표 기준')은 순환적이고, 곱셈 점수의 '몇 %'는 우리가 고른 척도·절단점 범위에 따라 달라진다.
  L-E4-MODEL: >-
    모델 단독 표본은 작다(상황 8종·주입 8건). 모델 5개는 같은 입력 61건을 공유해 서로 독립이 아니다. 평온/위험 문장 짝은 사람이 아닌 에이전트가 설계했다.
  L-E5-SMALL: >-
    문항이 작다(주입 제외 61문항·주입 16건·쌍 15개). 판정자들은 같은 문항을 공유해 서로 독립이 아니고, luna 는 크레딧 소진으로 빠졌으며, 로컬 모델은 글자 확률·클라우드는 서로 다른 인터페이스라 같은 측정이 아니다.
  L-E5-STRUCT: >-
    운영 집계 요약에는 상황 내용이 없어 평온 문장과 위험 문장이 같은 입력이 된다. 그래서 올림이 0 에 가까운 것은 실험이 발견한 것이 아니라 입력에서 정해진 구조상 결과다.
  L-E5-DRAFT: >-
    초안 라벨(에이전트가 표 규칙으로 만든 것)도 모델 답도 정답이 아니다. 라벨에 기대는 값은 '초안 라벨 의존'으로만 읽는다.
  L-E5-CODER: >-
    맹검 코더가 만든 41종 코드는 사례의 위험 구분을 사실상 다시 적은 것일 수 있고, 규칙 매핑은 맹검이 아니다. 이 코드를 운영에서 자동으로 얻을 수 있는지는 시험하지 않았다.
  L-E5-JEV: >-
    Jev API 한 판정자의 0.54 는 결과를 본 뒤 눈에 띈 사후 관찰이고 표본이 13건이라 단독으로 결론을 세우지 않는다.
  L-E8: >-
    측정 대상은 U1/U3 변경 전 코드다(변경 뒤에는 다시 돌려야 한다). 변이기는 AST 로 직접 만든 것이고 한 번에 한 곳만 바꾸며 상용 도구와 점수를 비교할 수 없다. 동치·안전 관련 분류는 한 사람이 코드를 읽고 한 판단이고, 변이가 같은 줄에 뭉쳐 있어 구간은 실제보다 좁다. 줄 커버리지만 쟀다(분기 아님).
  L-E6: >-
    거주자는 확률 모델이고 알아챔·지연·피로·수고·잘못 누름의 값은 모두 정한 값이며 사람 자료가 아니다. 성향은 3종뿐이고 선호 변화는 15일째 한 번뿐이다. 모아보기 열람 80%도 가정이며, 실제 데몬은 모아보기를 전달하지 못한다(tray0). 잘못 꺼진 도움을 세는 집계는 모아보기 항목도 '내놓음'으로 세므로 tray0 의 '모든 장면' 값은 실제보다 적게 센 값이다.
  L-E6-POST: >-
    회복 지표의 '바뀐 장면의 재수락'과 '정적 시스템 대비 회복'은 결과를 본 뒤 추가한 사후 기준이다. 등록된 형태(문자 그대로)는 변하지 않는 장면의 수락에 가려 새 장면을 보지 못한다. 사후 기준에서 게이트가 약 10~12일 늦춘다는 서술은 기술 결과이며 등록된 판정 근거가 아니다.
  L-E9: >-
    luna 호출 109건이 전부 실패해 H5.4 의 핵심 질문(두 모델이 갈리는가)에는 답이 없다. 장면이 편의 제안 4종과 안전 1건으로 좁아 Jev 가 하한을 벗어나는 어려운 장면이 없었고, 하한은 Jev 입력의 일부다. 씨앗은 대본의 시각·값만 바꿔 실행 사이 호출 수가 거의 같고, 비용은 표 가격 기준 추정이며, 실제 모델 응답은 시점에 따라 달라 재현이 보장되지 않는다.
  L-E10: >-
    클라우드 3종(Jev API·Haiku·Gemini)과 로컬 5종은 인터페이스(첫 글자 확률·확률 점수·생성형 JSON)·모델 크기·학습이 모두 달라 '클라우드라서'를 분리하지 못한다. 기본 상황·변형·대조 문장은 같은 계열 에이전트가 썼고, 대조 팔은 '중립 문장 추가'라 순수 기준선이 아니다. 클라우드는 항목당 한 번만 표집했다. 이 결과는 모델이 주입에 흔들리는 정도이며 LIOT 의 안전을 말하지 않는다(최종값은 하한이 지킨다). 판정은 등록 지표(뒤집힘)에 대한 것이고 순효과의 구간 하한은 0.10 아래다.
  L-E11: >-
    C4.2 의 놀라게 하는 판은 기준 조정 뒤 '긴급 상황:' 같은 정서 틀이 대부분이라 어휘 조작이 약하고, 다시 쓴 사례는 쌍 18개뿐이며 평온 사례의 원문 올림은 판정자당 1~2건이다. C4.3 은 45사례 중 26사례가 네 필드 모두 기본값이라 도달 가능한 몫의 상한이 약 0.56 이다. 코더 둘은 같은 계열 에이전트이고 필드는 벤치 문자열 변형이지 운영 필드가 아니다. 규칙 조회와 모델의 비교는 초안 라벨(15쌍)에 기대며 올림 없는 팔에서 자명하게 성립한다.
  L-E12: >-
    증거가 거의 비어 있어(한 줄 요약 + 행동 종류) 하한이 정보량이 큰 필드다. 장면 종류가 5개뿐(방향별 3개)이고 같은 장면이 씨앗만 바꿔 107번 반복돼 107 은 표본 크기가 아니며 군집 붓스트랩 구간이 퇴화해 점 추정을 서열로만 읽는다. 하한 값이 선택지와 같은 낱말이라 하한을 이해하고 존중하는 것과 글자를 따라 쓰는 것을 구별할 수 없다. 인터페이스가 서로 다르고, 분석 코드는 실행 전에 커밋하지 않았다(지표 정의가 결과 전에 고정됐는지는 확인할 수 없다). 이 수치로 LIOT 의 안전을 주장하지 않는다.
  L-E13: >-
    거주자는 가정이다(E6 와 같음). 성향 3종·선호 변화 한 번·씨앗 10개이고 구간은 씨앗 변동만 담는다. C4.6 의 판정 칸은 합침 값 하나이며 성향별로는 뒤바뀜형이 기준을 넘는다. C4.7 의 (1)+(2)+(3) 증가는 규칙별로 나누지 못했고, r1 이 tray0 폰 수락된 도움을 낮추는 기제는 숫자와 맞는 해석일 뿐 따로 떼어 확인하지 않았다. 분석 코드는 실행 전에 커밋하지 않았다(판정 규칙은 PREREG 로 실행 전 고정).
  L-E14: >-
    (b)는 가정의 산물이다 — 응답 확인 시간 평균 60초·창 180초가 결과를 거의 정하고, 놓침 정의는 거주자가 확인해 호출이 멈춘 위험 사건도 놓침으로 센다. (c)의 절단 모델은 SQLite 문장 단위 kill -9 이고 전원 차단 시 fsync 는 모사하지 않으며, 34.9%는 절단 시점을 문장 수로 균등하게 뽑은 값이지 실제 세계의 발생 빈도가 아니다. 벤치 지연은 높은 부하의 한 기계에서 쟀다. 퍼징의 '위반 없음'은 그 범위 안에서의 의미다.
  L-U6: >-
    U6 이전 값은 E14 summary.json 의 결정적 전수 탐색(가스·문 × 취약 가구 유무, 102회)이고, 이후 값은 summary.json 이 아니라 kit 이 현재 코드에서 같은 탐색을 다시 돌려 저장한 값이다(실험 폴더의 새 측정이 아니다). 전수 탐색은 안전 읽기 하나의 절단 지점만 덮으며 전원 차단·동시성의 모든 조합을 덮지 않는다. 읽기 자체가 남지 않는 문장 1~4 와 재시작 시점 센서 재동기화 빈틈은 U6 으로 닫히지 않았다.
  L-E16: >-
    C4.12 의 하한 모양 둘과 무작위 척도는 우리가 정했고 표는 비교 기준점이지 정답이 아니다. C4.13 은 E3 시뮬레이터의 가정 범위 안의 결과다. (b)의 이점은 생성기 노브와 E3 거주자 모델에 의존하고 피로·지연 0 은 부담 효과 0 의 한 구현이다. 사후 기준(R2, 같은 상한 비교군, H2.1 사후 재판정)은 등록 판정이 아니다.
  L-E16-CODER: >-
    독립 코더 둘은 같은 계열 모델이고 견본이 12개뿐이며 지속 칸의 κ 가 0.27 로 낮다. 코더가 E3 결과를 보지 않았다는 것은 프롬프트와 도구 사용 0회로만 뒷받침된다. 순환 점검은 견본별 평균 단계가 세 값으로 뭉치는 구조라 순서 상관이 크게 나오기 쉽고, 켄달 τ-b 로 재면 0.789 로 0.8 아래다(등록 통계량은 스피어만이라 판정은 구조상 결과로 둔다). 열세가 줄지 않았다는 방향도 LIOT 에 대한 증거로 쓰지 않는다.
  L-PENDING: >-
    이 실험은 아직 끝나지 않아 숫자가 없다. 보고서에는 '진행 중'이라고만 쓰고 추정 숫자를 넣지 않는다.

inconsistencies:
  - id: INC-1
    where: e2_invariants
    text: >-
      RESULTS.md 의 C2.8 표는 '취약성 못 보는 모드'에서 AUC 0.8 이상 비구조 칸 192칸 중 c*>2 가 41/96 = 42.7%(공격 0%에서 6/32)라고 적는다. 그러나 summary.json 의 h15b.by_mode.blind.auc_ge_0.8_nonstructural 은 비어 있다(cells 0, 값 null). 숫자는 h15b.cells 에서 다시 계산하면 RESULTS.md 와 같다(kit 의 파생값 E2-05). RESULTS.md 가 틀린 것이 아니라 summary.json 의 요약이 빠진 것이다.
  - id: INC-2
    where: e2_invariants
    text: >-
      RESULTS.md 는 H1.5 의 c* 를 모드별로 적고 '두 모드를 합친 중앙값은 쓰지 않는다'고 한다(진실 모드 중앙 1.02, 못 보는 모드 5.02). summary.json 의 h15.cstar_range_tradeoff_cells 는 바로 그 합친 값(최소 0.076·중앙 2.016·최대 8.27)만 저장하고 모드별 중앙값은 저장하지 않는다. kit 은 h15.cells 에서 모드별로 다시 계산했다(파생값 E2-04, 기본 알람 구성 칸만).
  - id: INC-3
    where: e3_policy · e8 · e14 · e16
