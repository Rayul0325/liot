# Machine-readable claim list behind experiments/REPORT_KIT.md.
#
# One claim = one report sentence. One item = one number inside it.
#   path      key path into <exp>/results/summary.json. Elements: a dict key, a list index, a
#             selector {field: value} that picks a list row, or "*" (fan out over a dict's values,
#             needs `agg`).
#   expected  the value the report quotes, in DISPLAY units (after `scale`), rounded to `round`
#             decimals. `TBD` is a placeholder that `check_numbers --propose` fills.
#   md        the text as printed in the experiment's RESULTS.md. The checker reports a
#             RESULTS-DIFF when RESULTS.md and summary.json disagree (it never edits either file).
# Pending claims (kind: pending) wait for an experiment whose summary.json has not landed yet.

limits:
  L-SIM: >-
    거주자가 알림을 읽고 판단하는 모델(피로·무심코 승인·정확도·응답 지연)은 전부 가정이고 사람 데이터로 맞춘 값이 아니다. 결론은 '가정한 범위 안에서'만 읽는다.
  L-GEN: >-
    시뮬레이터가 만든 해로운 제안의 약 96%가 LIOT 자신의 단계(땅거미·불씨)에 놓이는 것은 생성기를 우리가 쓴 결과이지 세상에서 잰 값이 아니다. 이 정렬에 기대는 수치는 구조상 결과다.
  L-GEN-LIGHT: >-
    생성기의 해로움 규칙과 견본, 그리고 해로운 제안이 어느 단계에 놓이는지를 정하는 노브는 우리가 정했다. 잔잔 쪽 해로움은 한 견본(조명 끄기)에 몰려 있어 다른 잔잔 견본은 시험하지 않았다.
  L-SEEDNOISE: >-
    구간은 같은 매개변수 점 안에서 씨앗만 다시 뽑은 '씨앗 잡음'이다. 가정(매개변수)의 불확실성은 어느 구간에도 들어 있지 않고, 세트 사이의 변동은 사분위로만 보였다.
  L-LAT: >-
    모델 지연(0.2·1.5·4초)·올림 확률 30%·마감 2초는 가정이고, 송신기는 가짜이며, 시간은 부하가 높은 한 대의 기계에서 번갈아 잰 상대 비교다. 폰까지 닿는 실제 시간은 재지 않았다.
  L-LAT-ALT: >-
    비교 대안은 운영 서비스를 상속한 얇은 래퍼이고, 지연의 차이는 '대안이 모델을 기다리도록 정의됐다'는 데서 나온다. 모델 응답의 내용은 재생하지 않았고 올림 여부는 가정이다.
  L-REPLAY: >-
    벤치 재생은 상황 사례 32건뿐이고 맥락 문장이 운영과 다르다. 모델은 정답이 아니므로 '불일치'는 '오류'가 아니다.
  L-FUZZ: >-
    '위반 0'은 무작위 퍼징이 만든 경로 안에서의 0이다. 경로를 강제로 채운 퍼징에서는 게이트 1(안전 알림이 늦거나 침묵하지 않는다)과 부딪히는 알려진 문제 두 종류가 잡혔다. 재시작·동시성의 모든 조합은 덮지 않았다.
  L-STRUCT-RULE: >-
    정답이 우리 표나 규칙에서 나오는 결과는 '우리 규칙을 우리 코드가 지킨다'는 뜻일 뿐 다른 구조와의 우열을 말하지 않는다. 비교 결론에 쓰지 않는다.
  L-CSTAR: >-
    모델 정직도·공격 비율·센서 오경보율·미등록 취약 가구 비율은 모두 가정이고 범위를 쓸어 보았을 뿐이다. 최종값 방식과 추론 변형은 서비스에 구현하지 않고 결정 수준에서 시뮬레이션했다.
  L-C28: >-
    탐지기 문턱(오탐 상향률 5%)과 '관찰 필드로 드러나는 위험' 비율은 가정이고, AUC 는 정규분포 가정의 요약이다. 반증 조건에 '몇 칸에서'가 없어 두 읽기를 모두 적었으므로, 결론은 읽기에 달렸다.
  L-FAKECLOCK: >-
    가짜 시계에서의 계수이고 시간 값은 이상적인 데몬(저장된 다음 발화 시각으로 점프)을 가정한다. 실제 데몬은 사다리 틱 때문에 0~5초 더 늦다.
  L-LADDER: >-
    가짜 시계와 가짜 송신기이고 시나리오 16개는 명세의 대표 경로일 뿐 모든 조합이 아니다. 송신 지연이 사다리 틱을 밀어내는 효과는 E1 에서 따로 잰다.
  L-BYSTANDER: >-
    보호자 응답은 지수분포 가정의 시뮬레이션이고 실제 가족의 응답 분포는 측정하지 않았다. 방관 효과 지수와 무응답 확률도 가정이며, 순차 호출은 구현하지 않고 시뮬레이션만 했다.
  L-E4-NOGT: >-
    위험 등급에는 독립된 정답이 없다. 우리 조회표를 기준점으로 쓴 값('표 기준')은 순환적이고, 곱셈 점수의 '몇 %'는 우리가 고른 척도·절단점 범위에 따라 달라진다.
  L-E4-MODEL: >-
    모델 단독 표본은 작다(상황 8종·주입 8건). 모델 5개는 같은 입력 61건을 공유해 서로 독립이 아니다. 평온/위험 문장 짝은 사람이 아닌 에이전트가 설계했다.
  L-E5-SMALL: >-
    문항이 작다(주입 제외 61문항·주입 16건·쌍 15개). 판정자들은 같은 문항을 공유해 서로 독립이 아니고, luna 는 크레딧 소진으로 빠졌으며, 로컬 모델은 글자 확률·클라우드는 서로 다른 인터페이스라 같은 측정이 아니다.
  L-E5-STRUCT: >-
    운영 집계 요약에는 상황 내용이 없어 평온 문장과 위험 문장이 같은 입력이 된다. 그래서 올림이 0 에 가까운 것은 실험이 발견한 것이 아니라 입력에서 정해진 구조상 결과다.
  L-E5-DRAFT: >-
    초안 라벨(에이전트가 표 규칙으로 만든 것)도 모델 답도 정답이 아니다. 라벨에 기대는 값은 '초안 라벨 의존'으로만 읽는다.
  L-E5-CODER: >-
    맹검 코더가 만든 41종 코드는 사례의 위험 구분을 사실상 다시 적은 것일 수 있고, 규칙 매핑은 맹검이 아니다. 이 코드를 운영에서 자동으로 얻을 수 있는지는 시험하지 않았다.
  L-E5-JEV: >-
    Jev API 한 판정자의 0.54 는 결과를 본 뒤 눈에 띈 사후 관찰이고 표본이 13건이라 단독으로 결론을 세우지 않는다.
  L-E8: >-
    측정 대상은 U1/U3 변경 전 코드다(변경 뒤에는 다시 돌려야 한다). 변이기는 AST 로 직접 만든 것이고 한 번에 한 곳만 바꾸며 상용 도구와 점수를 비교할 수 없다. 동치·안전 관련 분류는 한 사람이 코드를 읽고 한 판단이고, 변이가 같은 줄에 뭉쳐 있어 구간은 실제보다 좁다. 줄 커버리지만 쟀다(분기 아님).
  L-PENDING: >-
    이 실험은 아직 끝나지 않아 숫자가 없다. 보고서에는 '진행 중'이라고만 쓰고 추정 숫자를 넣지 않는다.

inconsistencies:
  - id: INC-1
    where: e2_invariants
    text: >-
      RESULTS.md 의 C2.8 표는 '취약성 못 보는 모드'에서 AUC 0.8 이상 비구조 칸 192칸 중 c*>2 가 41/96 = 42.7%(공격 0%에서 6/32)라고 적는다. 그러나 summary.json 의 h15b.by_mode.blind.auc_ge_0.8_nonstructural 은 비어 있다(cells 0, 값 null). 숫자는 h15b.cells 에서 다시 계산하면 RESULTS.md 와 같다(kit 의 파생값 E2-05). RESULTS.md 가 틀린 것이 아니라 summary.json 의 요약이 빠진 것이다.
  - id: INC-2
    where: e2_invariants
    text: >-
      RESULTS.md 는 H1.5 의 c* 를 모드별로 적고 '두 모드를 합친 중앙값은 쓰지 않는다'고 한다(진실 모드 중앙 1.02, 못 보는 모드 5.02). summary.json 의 h15.cstar_range_tradeoff_cells 는 바로 그 합친 값(최소 0.076·중앙 2.016·최대 8.27)만 저장하고 모드별 중앙값은 저장하지 않는다. kit 은 h15.cells 에서 모드별로 다시 계산했다(파생값 E2-04, 기본 알람 구성 칸만).
  - id: INC-3
    where: e3_policy
    text: >-
      RESULTS.md 가 정확히 .x5 인 백분율을 일관되게 반올림하지 않는다: 88.25%를 '88.2', 79.75%를 '79.7', 30.25%를 '30.2'(E3), 56.25%를 '56.2'(E8) 로 쓰지만 71.25%는 '71.3', 13.25%는 '13.3' 으로 쓴다. 의미는 같고 마지막 자리 반올림만 다르다. kit 은 이 네 값을 소수 둘째 자리까지 적었다.
  - id: INC-4
    where: RESEARCH_LOG.md ↔ HYPOTHESES.md
    text: >-
      연구 일지 02:05 행은 이제 'E5 의 luna 판정자 실행 불가(E9 의 H5.4 도 같은 이유로 판정 불가가 됨)'라고 적는다(이전 판은 H5.4 판정 불가를 E5 결과처럼 적었다). 다만 E9 결과 자체는 아직 검토 중이라 kit 은 H5.4 를 '대기'로 둔다. E5 쪽 luna 불가는 H5.2 의 한계이며 H5.2 는 '판정 불가'다.
  - id: INC-5
    where: HYPOTHESES.md
    text: >-
      H6.1·H6.2·H6.3(사다리·호출·테스트)이 'Q1' 제목 아래에 적혀 있지만 번호는 H6.x 이고 실험은 E7·E8 이다. kit 은 이를 Q6 으로 묶었다.
  - id: INC-6
    where: e3_policy
    text: >-
      '해로운 제안의 95.8%가 땅거미·불씨' 는 풀링 값(summary.json harm_alignment.harmful_share_dusk_or_ember_pooled 0.9575)이다. 같은 파일의 '세트 평균' 값은 95.9%, 검토의 재계산은 96.4% 였다. 정의·표본 차이이고 오류는 아니다(RESULTS.md 와 HYPOTHESES.md 사후 기록이 모두 이를 밝힌다).

claims:
  # ------------------------------------------------------------------ III. 방법 (규모)
  - id: M-01
    group: III
    exp: e1_latency
    text: E1 은 진짜 서비스로 사건 300건 × 칸 20개(구조 5종 × 모델 조건 4종)를 쟀다.
    limit: L-LAT
    items:
      - {label: 사건 수, path: [main, n_incidents], expected: 300, round: 0, fmt: "{:,.0f}", unit: " 건"}
      - {label: 칸 수, path: [main, cells], agg: len, expected: 20, round: 0, fmt: "{:,.0f}", unit: " 칸"}
  - id: M-02
    group: III
    exp: e2_invariants
    text: E2 는 모델 행동 6종 × 600회의 무작위 퍼징과, 칸마다 사건 20,000개 × 씨앗 10개의 보호자 호출 시뮬레이션을 했다.
    limit: L-FUZZ
    items:
      - {label: 퍼징 에피소드, path: [fuzz, total_episodes], expected: 3600, round: 0, fmt: "{:,.0f}", unit: " 회"}
      - {label: 사건 수(씨앗 하나), path: [h15, assumptions, events_per_seed], expected: 20000, round: 0, fmt: "{:,.0f}", unit: " 건"}
      - {label: 씨앗 수, path: [h15, assumptions, seeds], expected: 10, round: 0, fmt: "{:,.0f}", unit: " 개"}
  - id: M-03
    group: III
    exp: e3_policy
    text: E3 는 매개변수 400세트(라틴 초입방) × 씨앗 20개 × 30일을 같은 사건열로 모든 정책에 돌렸다.
    limit: L-SIM
    items:
      - {label: 세트 수, path: [blocks, main, sets], expected: 400, round: 0, fmt: "{:,.0f}", unit: " 세트"}
      - {label: 씨앗 수, path: [blocks, main, seeds], expected: 20, round: 0, fmt: "{:,.0f}", unit: " 개"}
      - {label: 기간, path: [blocks, main, days], expected: 30, round: 0, fmt: "{:,.0f}", unit: " 일"}
  - id: M-04
    group: III
    exp: e4_scoring
    text: E4 는 24가지 입력에 조회표·곱셈 점수·단일 등급·모델 단독을 대고, 곱셈 점수는 척도·절단점 조합을 전수로 훑었다.
    limit: L-E4-NOGT
    items:
      - {label: 입력 가짓수, path: [table, n_inputs], expected: 24, round: 0, fmt: "{:,.0f}", unit: " 가지"}
      - {label: 우세 쌍, path: [table, n_dominance_pairs], expected: 156, round: 0, fmt: "{:,.0f}", unit: " 쌍"}
      - {label: 곱셈 척도 수(격자 M3), path: [mult_grid, M3, n_codings], expected: 900, round: 0, fmt: "{:,.0f}", unit: " 종"}
      - {label: 곱셈 설정 수(격자 M3), path: [mult_grid, M3, n_settings], expected: 795588, round: 0, fmt: "{:,.0f}", unit: " 개"}
  - id: M-05
    group: III
    exp: e5_models
    text: E5 는 벤치 61문항(주입 제외) × 반복 2회를 판정자 7명(로컬 5·클라우드 2)에게 물었다.
    limit: L-E5-SMALL
    items:
      - {label: 주입 제외 문항 수, path: [h51_sentence_vs_operational, jevk5-9b-q8, rep0, n_items], expected: 61, round: 0, fmt: "{:,.0f}", unit: " 문항"}
      - {label: 판정자 수(luna·jev-omni 제외), path: [c31_subtype, rep0, judges], agg: len, expected: 7, round: 0, fmt: "{:,.0f}", unit: " 명"}
  - id: M-06
    group: III
    exp: e7_ladder
    text: E7 은 알림 사다리를 가짜 시계 위에서 16개 시나리오로 확인하고, 보호자 호출 방식을 108개 설정 × 10,000회로 시뮬레이션했다.
    limit: L-LADDER
    items:
      - {label: 사다리 시나리오, path: [conformance, by_driver, event, scenarios], expected: 16, round: 0, fmt: "{:,.0f}", unit: " 개"}
      - {label: 대조한 사건, path: [conformance, by_driver, event, events_matched], expected: 162, round: 0, fmt: "{:,.0f}", unit: " 건"}
      - {label: 시뮬레이션 설정 수, path: [mc, cells], agg: len, expected: 108, round: 0, fmt: "{:,.0f}", unit: " 개"}
      - {label: 설정마다 시행, path: [mc, trials_per_setting], expected: 10000, round: 0, fmt: "{:,.0f}", unit: " 회"}

  - id: M-07
    group: III
    exp: e8_mutation
    text: E8 은 안전 핵심 모듈 10개의 코드를 AST 로 일부러 틀리게 바꾼 변이 742개(핵심 연산자 450개)를 만들어 테스트가 알아채는지 보았다.
    limit: L-E8
    items:
      - {label: 변이 수(전수), path: [overall, all, n], expected: 742, round: 0, fmt: "{:,.0f}", unit: " 개"}
      - {label: 핵심 연산자 변이, path: [overall, core, n], expected: 450, round: 0, fmt: "{:,.0f}", unit: " 개"}
      - {label: 대상 모듈, path: [modules], agg: len, expected: 10, round: 0, fmt: "{:,.0f}", unit: " 개"}

  # ------------------------------------------------------------------ IV. Q1 안전 · E1
  - id: E1-01
    group: IV.Q1
    exp: e1_latency
    hyp: H1.1
    verdict: 구조상 결과
    text: LIOT(표 우선 발송)의 첫 경보는 모델 조건과 무관하게 수 밀리초다. 모델을 기다리는 대안은 기다린 시간만큼 늦다. 이 차이는 '대안이 기다리도록 정의됐다'는 데서 나오므로 비교 결론에 쓰지 않는다.
    fig: e1_latency/figures/latency_by_arm_cond.png
    limit: L-LAT-ALT
    items:
      - {label: LIOT 첫 경보 지연 중앙값(모델 정상), path: [main, cells, liot/normal, median], expected: 2.7, round: 1, scale: 1000, fmt: "{:.1f}", unit: " ms", md: "2.7"}
      - {label: LIOT 첫 경보 지연 p95(모델 정상), path: [main, cells, liot/normal, p95], expected: 4.7, round: 1, scale: 1000, fmt: "{:.1f}", unit: " ms", md: "4.7"}
      - {label: 모델 뒤 발송 − LIOT 중앙값(모델 정상 0.2초), path: [main, delta_vs_liot, wait_for_model/normal, median, diff], expected: 205.4, round: 1, scale: 1000, fmt: "{:+.1f}", unit: " ms", md: "+205.4"}
      - {label: 모델 뒤 발송 − LIOT 중앙값(모델 느림 1.5초), path: [main, delta_vs_liot, wait_for_model/slow, median, diff], expected: 1506.6, round: 1, scale: 1000, fmt: "{:+.1f}", unit: " ms", md: "+1506.6"}
      - {label: 모델 뒤 발송 − LIOT 중앙값(마감 초과 4초), path: [main, delta_vs_liot, wait_for_model/timeout, median, diff], expected: 2002.0, round: 1, scale: 1000, fmt: "{:+.1f}", unit: " ms", md: "+2002.0"}
